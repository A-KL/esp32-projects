[env:ESP32-S3-Touch-Lcd-349]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1-n16r8v
monitor_speed = 115200

monitor_filters = 
	time
	default
	esp32_exception_decoder

lib_ignore =
	st7789
  rm67162
	imu_mpu6050
	hal_sdl2
	hal_stm32

lib_deps = 
	${env.lib_deps}
	adafruit/Adafruit BMP280 Library@^2.6.8
	mathertel/OneButton@^2.6.1
	adafruit/Adafruit MPU6050@^2.2.6
	../../lib/SensorLib

build_flags = 
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM

	; -D EXAMPLE_LCD_H_RES=172
	; -D EXAMPLE_LCD_V_RES=640

	-D LV_LOG_PRINTF
	-D LV_COLOR_16_SWAP=1
	-D LV_COLOR_SCREEN_TRANSP=0
	-D LV_COLOR_DEPTH=16
	-D LV_MEM_CUSTOM=1
	-D LV_DRAW_COMPLEX=1
	; -D LVGL_LCD_BUF_SIZE=EXAMPLE_LCD_H_RES*EXAMPLE_LCD_V_RES
	; -D LVGL_DMA_BUFF_LEN=EXAMPLE_LCD_H_RES*64*2
	; -D LVGL_SPIRAM_BUFF_LEN=EXAMPLE_LCD_H_RES*EXAMPLE_LCD_V_RES*2

	; -D SPI_FREQUENCY=40000000
	; -D TFT_SPI_MODE=SPI_MODE3

	-D EXAMPLE_IMU_ADDR=0x6b

  ; -D TFT_WIDTH=172
	; -D TFT_HEIGHT=640

	; -D TFT_TE=21
	; -D TFT_CS=9
	; -D TFT_SCK=10
	; -D TFT_BL=42
	; -D TFT_RST=5

	; -D TFT_SDA0=11
	; -D TFT_SDA1=12
	; -D TFT_SDA2=13
	; -D TFT_SDA3=14

	; -D PIN_LED=38
	-D PIN_BAT_VOLT=4
	-D PIN_BUTTON_1=38
	-D PIN_BUTTON_2=39

	-D I2C_SDA=47
	-D I2C_SCL=48

	-D I2C_TOUCH_SDA=17
	-D I2C_TOUCH_SCL=18
	-D I2C_TOUCH_ADDR=0x3b