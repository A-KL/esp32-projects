[platformio]
default_envs = arduino_nano
; src_dir = src-v2
src_dir = src-v3
; src_dir = src

[env:arduino_nano]
platform = atmelavr
framework = arduino
board = nanoatmega328
monitor_speed = 115200
upload_speed = 115200
build_flags = 
	-fexceptions
	-D CORE_DEBUG_LEVEL=4
	-DDEBUG
 	-D SERIAL_RX_BUFFER_SIZE=256
lib_deps =
	PowerBroker2/SerialTransfer@^3.1.5
	; adafruit/Adafruit SSD1306@^2.5.13
	; adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
	durydevelop/OLED SSD1306 - SH1106 @ ^1.0.7
	; olikraus/U8g2@^2.36.18
