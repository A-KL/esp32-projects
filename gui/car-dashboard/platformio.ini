[platformio]
boards_dir = ./boards
default_envs = emulator_x64
extra_configs =
	Emulator.ini
	T-Display-S3.ini
	T-Display-AMOLED.ini

[env]
build_flags = 
	-D LV_CONF_SKIP
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_FONT_MONTSERRAT_44
	-D LV_GRADIENT_MAX_STOPS=5
	-D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
	-D LV_USE_LOG=1
	-std=gnu++17
lib_archive = false
lib_deps = 
	lvgl=https://github.com/lvgl/lvgl/archive/refs/tags/v8.4.0.zip
