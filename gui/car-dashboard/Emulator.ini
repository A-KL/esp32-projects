[env:emulator_x64]
platform = native@^1.2.1
build_type = debug
extra_scripts = support/sdl2_build_extra.py

lib_deps = 
	${env.lib_deps}
	lv_drivers=https://github.com/lvgl/lv_drivers/archive/refs/tags/v8.3.0.zip

lib_ignore =
	rm67162
	st7789

build_src_filter = 
	+<*>
	+<../hal/sdl2>

build_flags = 
	${env.build_flags}
	-D LV_LOG_PRINTF=1
	!python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/sdl2')]))"
	-lSDL2
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_DRV_NO_CONF
	-D USE_SDL
	-D SDL_HOR_RES=536
	-D SDL_VER_RES=240
	-D SDL_ZOOM=1
	-D SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
	
	-D LV_MEM_CUSTOM=1
	-D LV_MEM_SIZE="(128U * 1024U)"
	
	-I /opt/homebrew/Cellar/sdl2/2.32.10/include
	-L /opt/homebrew/Cellar/sdl2/2.32.10/lib
