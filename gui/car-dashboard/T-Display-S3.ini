[env:T-Display-S3]
platform = espressif32
framework = arduino
board = lilygo-t-displays3
monitor_speed = 115200

monitor_filters = 
	time
	default
	esp32_exception_decoder
; debug_tool = esp-builtin
; upload_protocol = esptool ; Use this when burning with USB CDC

lib_ignore =
	rm67162

lib_deps = 
	${env.lib_deps}
	adafruit/Adafruit BMP280 Library@^2.6.8
	mathertel/OneButton@^2.6.1
	adafruit/Adafruit MPU6050@^2.2.6

build_src_filter = 
	+<*>
	+<../hal/esp32>

build_flags = 
	${env.build_flags}
	!python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/esp32')]))"
    ;-DARDUINO_USB_CDC_ON_BOOT=1
    -UARDUINO_USB_CDC_ON_BOOT
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_MODE=1
    ; Choose different options according to different driver chips
    ; Early use of CST328
    -DTOUCH_MODULES_CST_MUTUAL
    ; Use CST816 by default
    ; -DTOUCH_MODULES_CST_SELF   
	-D EXAMPLE_LCD_PIXEL_CLOCK_HZ=6528000
	-D EXAMPLE_LCD_H_RES=536
	-D EXAMPLE_LCD_V_RES=240

	-D LV_LOG_PRINTF
	-D LV_COLOR_16_SWAP=1
	-D LV_COLOR_SCREEN_TRANSP=0
	-D LV_COLOR_DEPTH=16
	-D LV_MEM_CUSTOM=1
	-D LV_DRAW_COMPLEX=1
	-D LV_USE_PERF_MONITOR=0
	-D LV_MEM_BUF_MAX_NUM=16
	-D LV_MEMCPY_MEMSET_STD=0
	-D LV_DPI_DEF=130
	-D LVGL_LCD_BUF_SIZE=EXAMPLE_LCD_H_RES*EXAMPLE_LCD_V_RES

	-D EXAMPLE_PSRAM_DATA_ALIGNMENT=64

	-D TFT_WIDTH=240
	-D TFT_HEIGHT=536

	-D PIN_LCD_BL=38
	-D PIN_LCD_D0=39
	-D PIN_LCD_D1=40
	-D PIN_LCD_D2=41
	-D PIN_LCD_D3=42
	-D PIN_LCD_D4=45
	-D PIN_LCD_D5=46
	-D PIN_LCD_D6=47
	-D PIN_LCD_D7=48

	-D PIN_POWER_ON=15

	-D PIN_LCD_RES=5
	-D PIN_LCD_CS=6
	-D PIN_LCD_DC=7
	-D PIN_LCD_WR=8
	-D PIN_LCD_RD=9

	-D PIN_BUTTON_1=0
	-D PIN_BUTTON_2=14
	-D PIN_BAT_VOLT=4

	-D I2C_SDA=43
	-D I2C_SCL=44
	