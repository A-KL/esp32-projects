[env:esp32-p4-nano]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = esp32-p4-evboard
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = 
	time
	default
	esp32_exception_decoder

lib_ignore =
	AudioOutputWithCallback
	Network
	Radio
	NoArduino
	NoCodec

build_unflags = 
	-fno-exceptions

lib_deps = 
	${env.lib_deps}
	; lovyan03/LovyanGFX@^1.2.7
	; moononournation/GFX Library for Arduino@^1.6.7
	https://github.com/adafruit/Adafruit-ST7735-Library.git@^1.11.0
	;https://github.com/adafruit/Adafruit-GFX-Library.git@^1.2.3
	igorantolic/Ai Esp32 Rotary Encoder@^1.7

build_flags = 
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D ARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
	-D I2C_SDA=7
	-D I2C_SCL=8
; TFT
	;-D LGFX_BACKEND=1
	-D AGFX_BACKEND=1
	; -D Arduino_GFX_BACKEND=1
	-D DEFAULT_FONT=NotoSansBold15
	-D USER_SETUP_LOADED=1

	-DST7789V_DRIVER
	-DUSE_HSPI_PORT
	-D TFT_SCLK=36
	-D TFT_MOSI=32
	-D TFT_RST=27
	-D TFT_DC=25
	-D TFT_CS=26
	-D TFT_BLK=-1
	-D TFT_MISO=33

; I2S
	-D I2S_MCK=13
	-D I2S_BCK=12
	-D I2S_WS=10
	-D I2S_SD=9
	-D I2S_MASTER=true
	-D I2S_MCLK_MULTIPLE=256
	-D I2S_IN_SD=11

; Controls
	-D MENU_PIN_A=21
	-D MENU_PIN_B=20
	-D MENU_BUTTON=05
	
	-D VOLUME_PIN_A=23
	-D VOLUME_PIN_B=4
	-D VOLUME_BUTTON=22