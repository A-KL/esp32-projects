[esp32-p4-common]
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = 
	time
	default
	esp32_exception_decoder
lib_ignore =
	AudioOutputWithCallback
	Network
	Radio
	NoArduino
	SD
lib_deps = 
	${env.lib_deps}
	igorantolic/Ai Esp32 Rotary Encoder@^1.7
	https://github.com/lovyan03/LovyanGFX.git#develop
	; lovyan03/LovyanGFX@^1.2.29
	; moononournation/GFX Library for Arduino@^1.6.7
	; https://github.com/adafruit/Adafruit-ST7735-Library.git@^1.10.4
	; finianlandes/SpotifyEsp32 @ ^5.0.1
build_flags = 
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM=1
	-D CORE_DEBUG_LEVEL=4
; TFT
	-D USER_SETUP_LOADED=1
	-D DEFAULT_FONT=NotoSansBold15

	-DST7789_DRIVER
	-DUSE_HSPI_PORT
	-D TFT_SCLK=20	;avoid pin 9
	-D TFT_MOSI=21
	-D TFT_RST=24 ;8
	-D TFT_DC=23
	-D TFT_CS=22
	-D TFT_BLK=-1
	-D TFT_MISO=-1 ;-1 ; can be 7 or 3 or -1
; I2S
	-D I2S_MCK=13
	-D I2S_BCK=12
	-D I2S_WS=10
	-D I2S_SD=9
	-D I2S_MASTER=true
	-D I2S_MCLK_MULTIPLE=256
	-D I2S_IN_SD=11

	-D I2C_SDA=7
	-D I2C_SCL=8
; Controls
	-D MENU_PIN_A=27
	-D MENU_PIN_B=33
	-D MENU_BUTTON=36
	
	-D VOLUME_PIN_A=25
	-D VOLUME_PIN_B=26
	-D VOLUME_BUTTON=32

[env:esp32-p4-nano-v1]
extends = esp32-p4-common
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-p4-evboard
build_unflags = 
	-fno-exceptions

[env:esp32-p4-nano-v3]
extends = esp32-p4-common
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-p4_r3-evboard
build_unflags = 
	-fno-exceptions
	-DARDUINO_USB_CDC_ON_BOOT