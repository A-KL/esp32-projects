[platformio]
;src_dir = src/simple
src_dir=src-ui

[env]
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=4
	-fexceptions
	-std=gnu++17
lib_deps = 
	bblanchon/ArduinoJson@^6.21.3
	bolderflight/Bolder Flight Systems SBUS@^8.1.4
	dxinteractive/ResponsiveAnalogRead@^1.2.1
	siteswapjuggler/Ramp @ ^0.6.3

[env:apple]
platform = native@^1.2.1
lib_compat_mode = off
build_type = debug
lib_ignore =
	AudioOutputWithCallback
build_flags =
	; ${env.build_flags}
	-Winconsistent-missing-override
	-std=gnu++17

	-D CONFIG_FILE=\"driver_config_bldc.h\"
	-D HOSTNAME=\"esp32-bldc-driver\"
	-DOUTPUT_MOTOR_DEBUG
	;-DINPUT_ESP_NOW_DEBUG
	;-DINPUT_PS3_DEBUG
	;-DINPUT_SBUS_DEBUG
	-D INPUT_MOTOR_MAX_LIMIT=0.5

	-DDEFINE_MAIN
	-DLGFX_AUTODETECT
	-DLGFX_BACKEND
	-DSH1107_DRIVER

	-I ${sysenv.HOMEBREW_PREFIX}/include/SDL2
	-L ${sysenv.HOMEBREW_PREFIX}/lib

  -lSDL2
  -lSDL2_ttf

	-I ../../lib/Fonts
	-I ../../lib/Lcd
	-I ../../lib/LcdCanvas
	-I ../../lib/NoArduino

	-D TFT_WIDTH=64
  -D TFT_HEIGHT=128

lib_deps = 
	; ${env.lib_deps}
	; siteswapjuggler/Ramp @ ^0.6.3
	; dxinteractive/ResponsiveAnalogRead@^1.2.1
	; https://github.com/lovyan03/LovyanGFX.git#develop
	lovyan03/LovyanGFX@^1.2.29
	../../lib/CoreGraphics

[env:esp32-c3-devkitm-1]
platform = espressif32@6.13.0
framework = arduino
board = esp32-c3-devkitm-1
build_flags = 
	-fexceptions
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=3
lib_deps = 
	me-no-dev/AsyncTCP@^1.1.1
	bblanchon/ArduinoJson@^6.21.3
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	bolderflight/Bolder Flight Systems SBUS@^8.1.4
	madhephaestus/ESP32Servo@^1.1.1

[env:esp32-bldc-driver]
; platform = espressif32@6.13.0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = esp-wrover-kit
build_flags = 
	${env.build_flags}
	-UARDUINO_USB_CDC_ON_BOOT
	-DHAS_BLUETOOTH
	-D CONFIG_FILE=\"driver_config_bldc.h\"
	-D HOSTNAME=\"esp32-bldc-driver\"
	-DOUTPUT_MOTOR_DEBUG
	;-DINPUT_ESP_NOW_DEBUG
	;-DINPUT_PS3_DEBUG
	;-DINPUT_SBUS_DEBUG
	-D INPUT_MOTOR_MAX_LIMIT=0.5

	-D SH1107_DRIVER
	-D TFT_WIDTH=64
  -D TFT_HEIGHT=128
	-D TFT_ROTATION=2 ;landscape
	-D TFT_I2C_ADDR=0x3C
	-D I2C_SDA=21
	-D I2C_SCL=22

	-I ../../lib/Fonts
	-I ../../lib/Lcd	
	-I ../../lib/LcdCanvas
	
lib_deps = 
	${env.lib_deps}
	jvpernis/PS3 Controller Host@^1.1.0
	lovyan03/LovyanGFX@^1.2.29
	../../lib/CoreGraphics
