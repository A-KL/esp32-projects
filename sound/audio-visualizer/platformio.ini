[platformio]
default_envs = esp32-s3-zero
; src_dir = src-font-issue
; src_dir=src-i2s
; src_dir=src-fm

extra_configs =
	apple.ini
	esp32-s3.ini
	esp32-s3-zero.ini
	esp32-wrover-kit.ini
	esp32-p4-nano.ini

[env]
lib_deps = 
	https://github.com/pschatzmann/arduino-audio-tools.git#v1.3.0
	https://github.com/pschatzmann/arduino-libhelix.git#v0.9.3
	https://github.com/takkaO/OpenFontRender.git#v2.0
	../../lib/CoreGraphics

lib_ignore =
	AudioOutputWithCallback
	FFT_CODE
	Network
	Radio
	ES8311
	WM8960
	ES9018K2M

build_flags =
	-fexceptions
	-std=gnu++17
	-Wno-narrowing

  -I ../../lib/VuOutput
	-I ../../lib/Fonts
	-I ../../lib/Lcd
	-I ../../lib/LcdCanvas

	-D OPEN_FONT_RENDERER=NotoSans_Bold

  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320

	-D WIFI_SSID=\"${sysenv.LOCAL_SSID}\"
	-D WIFI_PASSWORD=\"${sysenv.LOCAL_PASSWORD}\"

	-D SPOTIFY_CLIENT_ID=\"${sysenv.SPOTIFY_CLIENT_ID}\"
	-D SPOTIFY_CLIENT_SECRET=\"${sysenv.SPOTIFY_CLIENT_SECRET}\"
	-D SPOTIFY_REFRESH_TOKEN=\"${sysenv.SPOTIFY_REFRESH_TOKEN}\"

	-D FTT_BANDS_COUNT=30
	-D AUDIO_VU_RATIO=10

	