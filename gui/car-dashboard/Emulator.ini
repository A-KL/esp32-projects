[env:emulator_x64]
platform = native@^1.2.1
build_type = debug

lib_deps = 
	${env.lib_deps}
	lv_drivers=https://github.com/lvgl/lv_drivers/archive/refs/tags/v8.3.0.zip

lib_ignore =
	axs15231b
	rm67162
	st7789
	imu_qmi8658
	imu_mpu6050
	hal_esp32
	hal_stm32

build_flags = 
	${env.build_flags}
	-lSDL2
	-D LV_LOG_PRINTF=1
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_DRV_NO_CONF
	-D USE_SDL
	-D SDL_HOR_RES=536
	-D SDL_VER_RES=240
	-D SDL_ZOOM=1
	-D SDL_INCLUDE_PATH="\"SDL2/SDL.h"\"
	
	-D LV_MEM_CUSTOM=1
	-D LV_MEM_SIZE="(128U * 1024U)"
	
	-I /opt/homebrew/Cellar/sdl2-compat/2.32.72/include
	-L /opt/homebrew/Cellar/sdl2-compat/2.32.72/lib
